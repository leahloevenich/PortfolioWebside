<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lövenich</title>
    <link rel="stylesheet" href="style_snake.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="whole-box">
        <div class="heading">
            <div class="ws-heading">Leah Marie Lövenich presents...</div>
            <div class="banner">Snake</div>
        </div>

        <div class="whole-grid">
            <div id="board"></div>
            <div class="movebuttons">
                <button class="move-button" onclick="upClicked()">
                    <img src="../../images/minigames/ssp/ssp_scissor.png" alt="Icon">
                </button>
                <div class="two-buttons">
                    <button class="move-button" onclick="leftClicked()">
                        <img src="../../images/minigames/ssp/ssp_scissor.png" alt="Icon">
                    </button>
                    <button class="move-button" onclick="rightClicked()">
                        <img src="../../images/minigames/ssp/ssp_scissor.png" alt="Icon">
                    </button>
                </div>
                <button class="move-button" onclick="downClicked()">
                    <img src="../../images/minigames/ssp/ssp_scissor.png" alt="Icon">
                </button>
            </div>
        </div>
    </div>

    <div class="homemenu">
        <a href="../../index.html" class="image-button">
            <img src="../../images/home.png" alt="Button description">
        </a>
        <span> | </span>
        <a href="../../impressum.html" class="home-link">IMPRESSUM</a>
        <span> | </span>
        <a href="../../datenschutz.html" class="home-link">DATENSCHUTZ</a>
    </div>

    <script src="snake.js"></script>
</body>
</html>
