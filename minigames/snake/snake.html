<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lövenich</title>
    <link rel="stylesheet" href="style_snake.css">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../not_global_main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="whole-box">
        <div class="heading">
            <div class="ws-heading">Leah Marie Lövenich</div>
            <div class="banner" style="--steps: 11; --duration: 2s;">Captain Cat</div>
        </div>

        <div class="whole-grid">
            <div id="board"></div>
            <div class="movebuttons">
                <button class="move-button" onclick="upClicked()">
                    <img src="../../images/minigames/snake/arrow_up.png" alt="Icon">
                </button>
                <div class="two-buttons">
                    <button class="move-button" onclick="leftClicked()">
                        <img src="../../images/minigames/snake/arrow_left.png" alt="Icon">
                    </button>
                    <button class="move-button" onclick="rightClicked()">
                        <img src="../../images/minigames/snake/arrow_right.png" alt="Icon">
                    </button>
                </div>
                <button class="move-button" onclick="downClicked()">
                    <img src="../../images/minigames/snake/arrow_down.png" alt="Icon">
                </button>
            </div>
        </div>
    </div>

    <div class="homemenu">
        <a href="../../index.html" class="image-button"></a>
        <span> | </span>
        <a href="../../impressum.html" class="home-link">IMPRESSUM</a>
        <span> | </span>
        <a href="../../datenschutz.html" class="home-link">DATENSCHUTZ</a>        
        <span> | </span>
        <button onclick="changeLanguage('de')" class="lang-btn">DE</button>
        <span> | </span>
        <button onclick="changeLanguage('en')" class="lang-btn">EN</button>
    </div>

    <script src="snake.js"></script>
    <script src="../../lang.js"></script>
</body>
</html>
