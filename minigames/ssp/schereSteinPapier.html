<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lövenich</title>
    <link rel="stylesheet" href="style_ssp.css">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../not_global_main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="whole-box">
        <div class="heading">
            <div class="ws-heading">Leah Marie Lövenich</div>
            <div class="banner" style="--steps: 21; --duration: 2s;" data-de="Schere, Stein, Papier" data-en="Rock, paper, scissors">Rock, paper, scissors</div>
        </div>

        <div class="whole-grid">
            <div class="lastgame">
                <div class="gamedata">
                    <p><span data-de="Players Wahl: " data-en="Players choice: ">Players choice: </span><span id = "player" data-de="..." data-en="...">...</span></p>
                </div>
                <div class="gamedata">
                    <span id = "playerPoints">0</span>
                    <img src="../../images/minigames/ssp/draw.png" alt="Draw" id="res">
                    <span id = "computerPoints">0</span>
                </div>
                <div class="gamedata">
                    <p><span data-de="Computers Wahl: " data-en="Computers choice: ">Computers choice: </span><span id = "computer" data-de="..." data-en="...">...</span></p>
                </div>
            </div>

            <div class="game">
                <button class="imagebuttonGame" onclick="scissorClicked()">
                    <img src="../../images/minigames/ssp/scissor.png" alt="Icon">
                </button>

                <button class="imagebuttonGame" onclick="rockClicked()">
                    <img src="../../images/minigames/ssp/rock.png" alt="Icon">
                </button>
            
                <button class="imagebuttonGame" onclick="paperClicked()">
                    <img src="../../images/minigames/ssp/paper.png" alt="Icon">
                </button>
            </div>
        </div>
    </div>

    <div class="homemenu">
        <a href="../../index.html" class="image-button"></a>
        <span> | </span>
        <a href="../../impressum.html" class="home-link">IMPRESSUM</a>
        <span> | </span>
        <a href="../../datenschutz.html" class="home-link">DATENSCHUTZ</a>
        <span> | </span>
        <button onclick="changeLanguage('de')" class="lang-btn">DE</button>
        <span> | </span>
        <button onclick="changeLanguage('en')" class="lang-btn">EN</button>
    </div>

    <script src="schereSteinPapier.js"></script>
    <script src="../../lang.js"></script>
</body>
</html>
