<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lövenich</title>
    <link rel="stylesheet" href="style_ssp.css">
    <link rel="stylesheet" href="../../global.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="whole-box">
        <div class="heading">
            <div class="ws-heading">Leah Marie Lövenich presents...</div>
            <div class="banner" style="--steps: 21; --duration: 2s;">Rock, paper, scissors</div>
        </div>

        <div class="whole-grid">
            <div class="lastgame">
                <div class="gamedata">
                    <p>Players choice: <span id = "player">...loading...</span></p>
                </div>
                <div class="gamestats">
                    <span id = "playerPoints">0</span>
                    <p><span id = "res">...loading...</span></p>
                    <span id = "computerPoints">0</span>
                </div>
                <div class="gamedata">
                    <p>Computers choice: <span id = "computer">...loading...</span></p>
                </div>
            </div>

            <div class="game">
                <button class="imagebuttonGame" onclick="scissorClicked()">
                    <img src="../../images/minigames/ssp/scissor.png" alt="Icon">
                </button>

                <button class="imagebuttonGame" onclick="rockClicked()">
                    <img src="../../images/minigames/ssp/rock.png" alt="Icon">
                </button>
            
                <button class="imagebuttonGame" onclick="paperClicked()">
                    <img src="../../images/minigames/ssp/paper.png" alt="Icon">
                </button>
            </div>
        </div>
    </div>

    <div class="homemenu">
        <a href="../../index.html" class="image-button">
            <img src="../../images/home.png" alt="Button description">
        </a>
        <span> | </span>
        <a href="../../impressum.html" class="home-link">IMPRESSUM</a>
        <span> | </span>
        <a href="../../datenschutz.html" class="home-link">DATENSCHUTZ</a>
    </div>

    <script src="schereSteinPapier.js"></script>
</body>
</html>
