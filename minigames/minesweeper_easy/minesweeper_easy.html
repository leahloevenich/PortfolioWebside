<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leah Lövenich</title>
    <link rel="stylesheet" href="style_minesweeper_easy.css">
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../../not_global_main.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>
<body>
    <div class="whole-box">
        <div class="heading">
            <div class="ws-heading">Leah Marie Lövenich</div>
            <div class="banner" style="--steps: 11; --duration: 2s;">Poopsweeper</div>
        </div>

        <div class="whole-grid">
            <div class="gamefunctions">
                <button class="toggle-btn" id="flower" aria-pressed="false">
                    <img src="../../images/minigames/minesweeper/safe.png" alt="" class="toggle-icon">
                    <span class="toggle-label" data-de="Blume platzieren" data-en="Place flower">Place flower</span>
                </button>
                <div class="gamestats">
                    <p><span data-de="Feldgröße: " data-en="Field size: ">Field size: </span><span id = "fieldsize" data-de="...lädt..." data-en="...loading...">...loading...</span></p>
                    <p><span data-de="Anzahl an Bomben: " data-en="Number of bombs: ">Number of bombs: </span><span id = "numberBombs" data-de="...lädt..." data-en="...loading...">...loading...</span></p>
                </div>
                <button class="toggle-btn" id="stool" aria-pressed="false">
                    <img src="../../images/minigames/minesweeper/bomb.png" alt="" class="toggle-icon">
                    <span class="toggle-label" data-de="Kot platzieren" data-en="Place stool">Place stool</span>
                </button>
            </div>
            <div id="board"></div>
            
        </div>
    </div>

    <div class="homemenu">
        <a href="../../index.html" class="image-button"></a>
        <span> | </span>
        <a href="../../impressum.html" class="home-link">IMPRESSUM</a>
        <span> | </span>
        <a href="../../datenschutz.html" class="home-link">DATENSCHUTZ</a>
        <span> | </span>
        <button onclick="changeLanguage('de')" class="lang-btn">DE</button>
        <span> | </span>
        <button onclick="changeLanguage('en')" class="lang-btn">EN</button>
    </div>

    <script src="minesweeper_easy.js"></script>
    <script src="../../lang.js"></script>
</body>
</html>
